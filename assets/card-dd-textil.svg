<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="D&amp;D Textil">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2e"/><stop offset="1" stop-color="#08121f"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00b4d8"/><stop offset=".45" stop-color="#1e3a5f"/><stop offset="1" stop-color="#f4a261"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 60) scale(260)"><stop offset="0" stop-color="#00b4d8" stop-opacity=".22"/><stop offset="1" stop-color="#00b4d8" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="2" y="2" width="596" height="356" rx="18"/></clipPath>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace}
    .s{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}

    .sh{animation:sw 5s ease-in-out infinite}
    @keyframes sw{0%{transform:translateX(-300px)}60%,100%{transform:translateX(900px)}}
    .f{}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>
</defs>
<rect x="1.5" y="1.5" width="597" height="357" rx="19" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
<g clip-path="url(#clip)">
  <rect width="600" height="360" fill="url(#glow)"/>
  <rect class="sh" x="0" y="0" width="160" height="360" fill="url(#shine)" transform="skewX(-20)"/>
</g>
<rect x="28" y="28" width="56" height="56" rx="14" fill="#00b4d8" fill-opacity=".14" stroke="#00b4d8" stroke-opacity=".5"/>
<g transform="translate(56 58)"><g fill="none" stroke="#00b4d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-13 -6 H13 L11 15 H-11 Z"/><path d="M-6 -6 V-10 a6 6 0 0 1 12 0 V-6"/>
        <path d="M-5 3 c3 3 7 3 10 0" opacity=".8"/></g></g>
<text x="102" y="54" class="s" font-size="26" font-weight="800" fill="#ffffff">D&amp;D Textil</text>
<text x="103" y="78" class="m" font-size="12.5" fill="#00b4d8">E-commerce · Proyecto formativo SENA</text>

<g transform="translate(460 32)"><rect width="112" height="26" rx="13" fill="#2ee59d" fill-opacity=".12" stroke="#2ee59d" stroke-opacity=".55"/><circle cx="15" cy="13" r="4" fill="#2ee59d"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="26" y="17.5" class="m" font-size="12" fill="#2ee59d">2025 - hoy</text></g>
<text x="30" y="122" class="s" font-size="15.5" fill="#cbd5e1">Tienda en línea de telas con panel de gestión comercial:</text>
<text x="30" y="145" class="s" font-size="15.5" fill="#cbd5e1">venta por metraje, catálogo, carrito y pedidos.</text>
<g class="f" style="animation-delay:0.30s"><circle cx="40" cy="175" r="9" fill="#00b4d8" fill-opacity=".16"/><path d="M35.5 175 l3 3 l6 -6" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="180" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Triggers en PostgreSQL</tspan> que evitan la sobreventa</text></g>
<g class="f" style="animation-delay:0.48s"><circle cx="40" cy="202" r="9" fill="#00b4d8" fill-opacity=".16"/><path d="M35.5 202 l3 3 l6 -6" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="207" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Autenticación</tspan> y control de acceso por roles</text></g>
<g class="f" style="animation-delay:0.66s"><circle cx="40" cy="229" r="9" fill="#00b4d8" fill-opacity=".16"/><path d="M35.5 229 l3 3 l6 -6" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="234" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">API REST</tspan> en Java / Spring Boot + frontend React</text></g>
<g class="f" style="animation-delay:0.84s"><circle cx="40" cy="256" r="9" fill="#00b4d8" fill-opacity=".16"/><path d="M35.5 256 l3 3 l6 -6" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="261" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Docker + Scrum</tspan> con Git/GitHub y Taiga.io</text></g>
<g transform="translate(30 310)"><rect width="52" height="26" rx="7" fill="#ffa94d" fill-opacity=".14" stroke="#ffa94d" stroke-opacity=".55"/><text x="26.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#ffa94d">Java</text></g>
<g transform="translate(90 310)"><rect width="67" height="26" rx="7" fill="#7ed957" fill-opacity=".14" stroke="#7ed957" stroke-opacity=".55"/><text x="33.5" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#7ed957">Spring</text></g>
<g transform="translate(165 310)"><rect width="60" height="26" rx="7" fill="#61dafb" fill-opacity=".14" stroke="#61dafb" stroke-opacity=".55"/><text x="30.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#61dafb">React</text></g>
<g transform="translate(233 310)"><rect width="82" height="26" rx="7" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".55"/><text x="41.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#38bdf8">Tailwind</text></g>
<g transform="translate(323 310)"><rect width="98" height="26" rx="7" fill="#8fa8ff" fill-opacity=".14" stroke="#8fa8ff" stroke-opacity=".55"/><text x="49.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#8fa8ff">PostgreSQL</text></g>
<g transform="translate(429 310)"><rect width="67" height="26" rx="7" fill="#4dabf7" fill-opacity=".14" stroke="#4dabf7" stroke-opacity=".55"/><text x="33.5" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#4dabf7">Docker</text></g>
</svg>