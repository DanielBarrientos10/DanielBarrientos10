<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Gracias por visitar">
<defs>
  <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0077b6"/><stop offset="1" stop-color="#00b4d8"/></linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#023e8a"/><stop offset="1" stop-color="#0077b6"/></linearGradient>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace}
    .s{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}

    .a{animation:mv 9s linear infinite} .b{animation:mv 14s linear infinite reverse}
    @keyframes mv{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
  </style>
  <clipPath id="fc"><rect x="1" y="1" width="1198" height="168" rx="18"/></clipPath>
  <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08121f"/><stop offset="1" stop-color="#0b1d33"/></linearGradient>
  <path id="wave" d="M0 0 Q150 -22 300 0 T600 0 T900 0 T1200 0 T1500 0 T1800 0 T2100 0 T2400 0 V200 H0Z"/>
</defs>
<rect x="1" y="1" width="1198" height="168" rx="18" fill="url(#fbg)"/>
<g clip-path="url(#fc)">
<text x="600.0" y="44" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#e2e8f0">¡Gracias por pasar! <tspan fill="#00b4d8">Construyamos algo juntos.</tspan></text>
<text x="600.0" y="70" text-anchor="middle" class="m" font-size="13" fill="#6b8299">&lt;/&gt; hecho con café, código y muchas ganas de aprender · Medellín, Colombia</text>
<g class="b" opacity=".55"><use href="#wave" y="112" fill="url(#w2)"/></g>
<g class="a" opacity=".9"><use href="#wave" y="128" fill="url(#w1)"/></g>
</g>
</svg>