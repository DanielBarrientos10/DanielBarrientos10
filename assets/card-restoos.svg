<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="RestoOS">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2e"/><stop offset="1" stop-color="#08121f"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#1e3a5f"/><stop offset="1" stop-color="#00b4d8"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 60) scale(260)"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="2" y="2" width="596" height="356" rx="18"/></clipPath>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace}
    .s{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}

    .sh{animation:sw 5s ease-in-out infinite}
    @keyframes sw{0%{transform:translateX(-300px)}60%,100%{transform:translateX(900px)}}
    .f{}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>
</defs>
<rect x="1.5" y="1.5" width="597" height="357" rx="19" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
<g clip-path="url(#clip)">
  <rect width="600" height="360" fill="url(#glow)"/>
  <rect class="sh" x="0" y="0" width="160" height="360" fill="url(#shine)" transform="skewX(-20)"/>
</g>
<rect x="28" y="28" width="56" height="56" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/>
<g transform="translate(56 58)"><g fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-15 8 a15 15 0 0 1 30 0 Z"/><path d="M-18 12 H18"/><path d="M0 -10 V-7"/><circle cx="0" cy="-12" r="2"/></g></g>
<text x="102" y="54" class="s" font-size="26" font-weight="800" fill="#ffffff">RestoOS</text>
<text x="103" y="78" class="m" font-size="12.5" fill="#a78bfa">App de escritorio · Gestión de restaurantes</text>

<g transform="translate(438 32)"><rect width="134" height="26" rx="13" fill="#ffd166" fill-opacity=".12" stroke="#ffd166" stroke-opacity=".55"/><circle cx="15" cy="13" r="4" fill="#ffd166"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="26" y="17.5" class="m" font-size="12" fill="#ffd166">en desarrollo</text></g>
<text x="30" y="122" class="s" font-size="15.5" fill="#cbd5e1">Sistema de gestión para restaurantes desarrollado</text>
<text x="30" y="145" class="s" font-size="15.5" fill="#cbd5e1">en C# con Windows Forms sobre .NET 8.</text>
<g class="f" style="animation-delay:0.30s"><circle cx="40" cy="175" r="9" fill="#a78bfa" fill-opacity=".16"/><path d="M35.5 175 l3 3 l6 -6" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="180" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Migración</tspan> de WPF (.NET Framework 4.8) a .NET 8</text></g>
<g class="f" style="animation-delay:0.48s"><circle cx="40" cy="202" r="9" fill="#a78bfa" fill-opacity=".16"/><path d="M35.5 202 l3 3 l6 -6" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="207" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Rediseño visual</tspan> de las pantallas</text></g>
<g class="f" style="animation-delay:0.66s"><circle cx="40" cy="229" r="9" fill="#a78bfa" fill-opacity=".16"/><path d="M35.5 229 l3 3 l6 -6" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="234" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Formularios editables</tspan> en el diseñador de Visual Studio</text></g>
<g class="f" style="animation-delay:0.84s"><circle cx="40" cy="256" r="9" fill="#a78bfa" fill-opacity=".16"/><path d="M35.5 256 l3 3 l6 -6" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="261" class="s" font-size="14.5" fill="#94a3b8" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="600">Interfaz de escritorio</tspan> nativa para Windows</text></g>
<g transform="translate(30 310)"><rect width="37" height="26" rx="7" fill="#b392f0" fill-opacity=".14" stroke="#b392f0" stroke-opacity=".55"/><text x="18.5" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#b392f0">C#</text></g>
<g transform="translate(75 310)"><rect width="67" height="26" rx="7" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".55"/><text x="33.5" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#a78bfa">.NET 8</text></g>
<g transform="translate(150 310)"><rect width="82" height="26" rx="7" fill="#60a5fa" fill-opacity=".14" stroke="#60a5fa" stroke-opacity=".55"/><text x="41.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#60a5fa">WinForms</text></g>
<g transform="translate(240 310)"><rect width="44" height="26" rx="7" fill="#60a5fa" fill-opacity=".14" stroke="#60a5fa" stroke-opacity=".55"/><text x="22.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#60a5fa">WPF</text></g>
<g transform="translate(292 310)"><rect width="120" height="26" rx="7" fill="#c084fc" fill-opacity=".14" stroke="#c084fc" stroke-opacity=".55"/><text x="60.0" y="17.5" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#c084fc">Visual Studio</text></g>
</svg>