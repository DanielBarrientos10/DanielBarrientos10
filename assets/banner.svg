<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Daniel Barrientos — Full Stack Developer en formación">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="0.55" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#062a45"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#caf0f8"/>
      <stop offset="1" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#0077b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12304f"/>
      <stop offset="1" stop-color="#0b1f36"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1b3a5c" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .in{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
      @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .orb1{animation:drift1 14s ease-in-out infinite alternate}
      .orb2{animation:drift2 18s ease-in-out infinite alternate}
      @keyframes drift1{to{transform:translate(90px,40px)}}
      @keyframes drift2{to{transform:translate(-120px,-30px)}}
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
      @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="orb1" cx="260" cy="70" r="150" fill="#0077b6" opacity="0.35" filter="url(#blur)"/>
  <circle class="orb2" cx="980" cy="300" r="170" fill="#00b4d8" opacity="0.22" filter="url(#blur)"/>

  <!-- texto -->
  <g class="mono in d1">
    <rect x="64" y="58" width="256" height="30" rx="15" fill="#00b4d8" fill-opacity="0.12" stroke="#00b4d8" stroke-opacity="0.5"/>
    <circle cx="84" cy="73" r="4.5" fill="#2ee59d"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="98" y="78" font-size="14" fill="#90e0ef">disponible · Medellín, CO</text>
  </g>

  <g class="in d2">
    <text x="62" y="152" class="sans" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Daniel Barrientos<tspan fill="#00b4d8" font-weight="400">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <g class="in d3">
    <text x="64" y="194" class="sans" font-size="23" font-weight="600" fill="#e2e8f0">Full Stack Developer en formación <tspan fill="#00b4d8">·</tspan> Backend first</text>
    <rect x="64" y="210" width="360" height="3" rx="1.5" fill="url(#line)"/>
  </g>

  <g class="mono in d4" font-size="15">
    <text x="64" y="246" fill="#94a3b8"><tspan fill="#00b4d8">const</tspan> formacion <tspan fill="#00b4d8">=</tspan> <tspan fill="#ffd166">"Tecnología ADSO · SENA"</tspan>;</text>
  </g>

  <g class="mono in d5" font-size="13" font-weight="600">
    <g transform="translate(64 272)">
      <rect width="78" height="30" rx="8" fill="#ed8b00" fill-opacity="0.14" stroke="#ed8b00" stroke-opacity="0.6"/>
      <text x="39" y="20" text-anchor="middle" fill="#ffb454">Java</text>
    </g>
    <g transform="translate(152 272)">
      <rect width="90" height="30" rx="8" fill="#3776ab" fill-opacity="0.18" stroke="#4b8bbe" stroke-opacity="0.7"/>
      <text x="45" y="20" text-anchor="middle" fill="#8ec5ff">Python</text>
    </g>
    <g transform="translate(252 272)">
      <rect width="84" height="30" rx="8" fill="#61dafb" fill-opacity="0.1" stroke="#61dafb" stroke-opacity="0.55"/>
      <text x="42" y="20" text-anchor="middle" fill="#9eeaff">React</text>
    </g>
    <g transform="translate(346 272)">
      <rect width="122" height="30" rx="8" fill="#4169e1" fill-opacity="0.16" stroke="#6d8cf0" stroke-opacity="0.7"/>
      <text x="61" y="20" text-anchor="middle" fill="#a9bcff">PostgreSQL</text>
    </g>
    <g transform="translate(478 272)">
      <rect width="88" height="30" rx="8" fill="#2496ed" fill-opacity="0.14" stroke="#2496ed" stroke-opacity="0.6"/>
      <text x="44" y="20" text-anchor="middle" fill="#8fd0ff">Docker</text>
    </g>
  </g>

  <!-- diagrama full stack animado -->
  <g class="in d3">
    <!-- conexiones -->
    <path id="p1" d="M842 96 C 900 96, 900 180, 958 180" fill="none" stroke="#1f4b73" stroke-width="2"/>
    <path id="p2" d="M842 264 C 900 264, 900 180, 958 180" fill="none" stroke="#1f4b73" stroke-width="2"/>
    <path d="M842 96 C 900 96, 900 180, 958 180" fill="none" stroke="#00b4d8" stroke-width="2" class="flow" opacity="0.8"/>
    <path d="M842 264 C 900 264, 900 180, 958 180" fill="none" stroke="#48cae4" stroke-width="2" class="flow" opacity="0.8"/>

    <!-- paquetes de datos -->
    <circle r="4.5" fill="#caf0f8" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4.5" fill="#caf0f8" filter="url(#glow)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>

    <!-- nodo frontend -->
    <g transform="translate(640 62)">
      <rect width="202" height="68" rx="14" fill="url(#node)" stroke="#2a5b87"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#61dafb" fill-opacity="0.15"/>
      <g transform="translate(32 34)" fill="none" stroke="#61dafb" stroke-width="1.6">
        <ellipse rx="13" ry="5"/><ellipse rx="13" ry="5" transform="rotate(60)"/><ellipse rx="13" ry="5" transform="rotate(120)"/>
        <circle r="2" fill="#61dafb" stroke="none"/>
      </g>
      <text x="62" y="31" class="sans" font-size="15" font-weight="700" fill="#e2e8f0">Frontend</text>
      <text x="62" y="51" class="mono" font-size="12" fill="#7dd3fc">React · Tailwind</text>
    </g>

    <!-- nodo base de datos -->
    <g transform="translate(640 230)">
      <rect width="202" height="68" rx="14" fill="url(#node)" stroke="#2a5b87"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#4169e1" fill-opacity="0.2"/>
      <g transform="translate(32 25)" fill="none" stroke="#a9bcff" stroke-width="1.6">
        <ellipse cx="0" cy="0" rx="10" ry="4"/>
        <path d="M-10 0 V16 C-10 21, 10 21, 10 16 V0"/>
        <path d="M-10 8 C-10 13, 10 13, 10 8"/>
      </g>
      <text x="62" y="31" class="sans" font-size="15" font-weight="700" fill="#e2e8f0">Base de datos</text>
      <text x="62" y="51" class="mono" font-size="12" fill="#a9bcff">PostgreSQL · MySQL</text>
    </g>

    <!-- nodo API -->
    <g transform="translate(958 136)">
      <circle class="pulse" cx="52" cy="44" r="44" fill="none" stroke="#00b4d8" stroke-width="2"/>
      <rect width="190" height="88" rx="16" fill="url(#node)" stroke="#00b4d8" stroke-opacity="0.8"/>
      <text x="22" y="34" class="mono" font-size="13" fill="#00b4d8">{ API REST }</text>
      <text x="22" y="58" class="sans" font-size="16" font-weight="700" fill="#ffffff">Spring Boot</text>
      <text x="22" y="76" class="mono" font-size="12" fill="#94a3b8">Django · FastAPI</text>
    </g>
  </g>
</svg>
